  age: five_year_bands
  gender: allowlisted_categories
  location: district_only
  direct_identifiers: omit
  dates: keyed_patient_offset
  ambiguous_identity: abstain
  raw_values_in_logs: prohibited
  output_sensitivity: treat_as_sensitive
